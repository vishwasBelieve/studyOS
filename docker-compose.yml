services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studyos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studyos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedding:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - uvicorn
      - embeddingserver:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro
    ports:
      - "8001:8001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/studyos_db
      SECRET_KEY: ${SECRET_KEY}
      EMBEDDING_SERVER_URL: http://embedding:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: